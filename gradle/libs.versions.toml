[versions]
kotlin = "2.3.0"
ktor = "3.2.0"
clikt = "5.0.3"
coroutines = "1.10.2"
serialization = "1.9.0"
sqlite = "3.49.1.0"
lucene = "10.4.0"
tika = "3.3.2"
pdfbox = "3.0.7"
poi = "5.5.1"
jsoup = "1.21.1"
commonsCsv = "1.14.1"
onnxruntime = "1.22.0"
djlTokenizers = "0.33.0"
logback = "1.5.18"
junit = "5.12.2"
junitPlatform = "1.12.2"

[libraries]
clikt = { module = "com.github.ajalt.clikt:clikt-jvm", version.ref = "clikt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio-jvm", version.ref = "ktor" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
lucene-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene" }
lucene-analysis-icu = { module = "org.apache.lucene:lucene-analysis-icu", version.ref = "lucene" }
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
poi-scratchpad = { module = "org.apache.poi:poi-scratchpad", version.ref = "poi" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commonsCsv" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
djl-tokenizers = { module = "ai.djl.huggingface:tokenizers", version.ref = "djlTokenizers" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
